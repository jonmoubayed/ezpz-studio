[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezpz-evals"
version = "0.1.0b1"
description = "Local-first document extraction evaluation service"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10,<12",
  "pypdf>=5,<7",
  "PyYAML>=6,<7",
  "jsonschema==4.26.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
]

[project.scripts]
ezpz = "ezpz:main"
ezpz-server = "backend.server:main"
ezpz-mcp = "backend.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=2.2,<3", "httpx>=0.28,<1"]

[tool.setuptools]
py-modules = ["ezpz", "server"]
packages = ["backend", "backend.tests"]
