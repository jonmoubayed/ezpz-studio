name: Beta release checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s backend/tests
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: Select package image
        run: echo "EZPZ_TEST_IMAGE=ezpz-studio:$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - run: docker build -t "$EZPZ_TEST_IMAGE" .
      - run: npm run test:package
      - run: npm run release:bundle
      - run: npm run test:install
      - uses: actions/upload-artifact@v4
        with:
          name: beta-package-${{ matrix.runner }}
          path: |
            release/*.tar.gz
            release/*.sha256
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.runner }}
          path: test-results/
